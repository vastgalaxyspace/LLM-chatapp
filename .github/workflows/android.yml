name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Seed secret canary
        run: printf 'HF_TOKEN=hf_ci_secret_canary\n' > local.properties
      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon clean testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Verify APK contains no token canary and only supported native ABIs
        shell: bash
        run: |
          if grep -a -R "hf_ci_secret_canary" app/build/outputs/apk; then exit 1; fi
          unzip -l app/build/outputs/apk/debug/app-debug.apk > apk-files.txt
          if grep -E "lib/(armeabi-v7a|x86)/" apk-files.txt; then exit 1; fi
          grep "lib/arm64-v8a/libinnoai_llama.so" apk-files.txt
          grep "lib/x86_64/libinnoai_llama.so" apk-files.txt
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports
            app/build/test-results
